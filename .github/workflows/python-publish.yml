# .github/workflows/python-publish.yml
name: pymgarch CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:  # no branches filter: stacked PRs (base != main) also get CI
  workflow_dispatch:  # release-train dispatches this at the tag it creates
    # (tags pushed with GITHUB_TOKEN do not fire `on: push` workflows)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for hatch-vcs

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev --extra numba

    - name: Run tests
      run: uv run pytest tests/ -v --cov=src/pymgarch --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # shallow fetch peels annotated tags: gh would then
                        # fall back to the merge-commit message as notes

    - name: Create GitHub Release
      # publish the annotated tag message as the release notes, read
      # explicitly from the tag object (robust against gh's local-git
      # fallback behavior); explicit --title keeps the bare tag name
      run: |
        git tag -l --format='%(contents)' "${{ github.ref_name }}" > /tmp/notes
        if [ ! -s /tmp/notes ]; then
          echo "::error::tag ${{ github.ref_name }} has no annotation message"
          exit 1
        fi
        gh release create "${{ github.ref_name }}" --notes-file /tmp/notes --title "${{ github.ref_name }}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for hatch-vcs

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build
      run: |
        pip install build hatch-vcs
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
