# .github/workflows/python-publish.yml
name: pymgarch CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:  # no branches filter: stacked PRs (base != main) also get CI
  workflow_dispatch:  # release-train dispatches this at the tag it creates
    # (tags pushed with GITHUB_TOKEN do not fire `on: push` workflows)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for hatch-vcs

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev --extra numba

    - name: Run tests
      run: uv run pytest tests/ -v --cov=src/pymgarch --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # shallow fetch peels annotated tags: gh would then
                        # fall back to the merge-commit message as notes

    - name: Create GitHub Release
      # publish the annotated tag message as the release notes, read from
      # the REMOTE tag object via the API: actions/checkout stores the tag
      # peeled in this job, so any local-git read (%(contents),
      # --notes-from-tag) silently returns the merge-commit message instead
      run: |
        REPO="${{ github.repository }}"
        TAG="${{ github.ref_name }}"
        TYPE=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.type)
        SHA=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)
        if [ "$TYPE" = "tag" ]; then
          gh api "repos/$REPO/git/tags/$SHA" --jq .message > /tmp/notes
        else
          echo "::error::tag $TAG is lightweight; the release train creates annotated tags"
          exit 1
        fi
        if [ ! -s /tmp/notes ]; then
          echo "::error::tag $TAG has no annotation message"
          exit 1
        fi
        gh release create "$TAG" --notes-file /tmp/notes --title "$TAG"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for hatch-vcs

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build
      run: |
        pip install build hatch-vcs
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
